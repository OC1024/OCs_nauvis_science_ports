[mod-name]
OCs_nauvis_science_ports=OCs Nauvis Wissenschafts-Ports
[mod-description]
OCs_nauvis_science_ports=Dieser Mod ermöglicht die Verwendung von Nauvis (basegame) wissenschaftlichen Paketen in Nicht-Nauvis Gebäuden. Nutze die Gießerei um Wissenschaftspakete der Automatisierung, Logistik und Militär produzieren, die Biokammer um die für Chemie und Weltraum oder die elektromamgnetische Anlage, um Wissenschaftspakete für Produktion und Zubehör zu produzieren. Wähle zwischen geklonten Rezepten und dem gleichen, aber hinzugefügten Kategoy.

[mod-setting-name]
science-cloning=Klonen der Wissenschaftspakete für die nicht-Nauvis-Gebäude.

[mod-setting-description]
science-cloning=Wenn aktiviert, werden Wissenschaftspaketrezepte für die nicht-Nauvis-Gebäude geklont, ansonsten werden die selben Rezepte geteilt. Deaktivierung vermeidet auch Duplikate.

