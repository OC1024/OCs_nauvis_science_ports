[mod-name]
OCs_nauvis_science_ports=OCs Nauvis Science Ports
[mod-description]
OCs_nauvis_science_ports=This mod enables the usage of Nauvis (basegame) science packs in non-Nauvis buildings. Use the foundry for automatic, logistic and military science packs, the biochamber for chemical and space science packs or the electromamgnetic plant for production and utility science packs. Choose between cloned recipes and the same but added categoy.

[mod-setting-name]
science-cloning=Clones the science packs for the non-Nauvis buildings.

[mod-setting-description]
science-cloning=If enabled, science packs recipes are cloned for the non-Nauvis buildings, else they share the same recipes. Disabling also avoids duplicates.